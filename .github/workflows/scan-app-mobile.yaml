name: Scan App Mobile Build
on:
    workflow_dispatch:
        inputs:
            platform:
                description: Platform to build
                type: choice
                options:
                    - all
                    - android
                    - ios
                default: all
            release_tag:
                description: 'GitHub Release tag to upload the build to (set by the release workflow; leave blank for a manual run)'
                type: string
                default: ''
env:
    APP_DIR: apps/scan-app
jobs:
    build-android:
        if: inputs.platform == 'all' || inputs.platform == 'android'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Setup pnpm store path
              id: pnpm-store
              run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17
            # The runner image already ships the Android SDK; only the NDK
            # version Tauri builds against and the platform are pinned here.
            # (android-actions/setup-android fails on this image: it tries to
            # install the removed 'tools' package.)
            - name: Install Android platform and NDK
              run: |
                  SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
                  yes | "$SDKMANAGER" --licenses > /dev/null || true
                  "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
                  echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
            - name: Cache Rust build
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: ${{ env.APP_DIR }}/src-tauri
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter scan-app...
            - name: Write signing config
              if: env.ANDROID_KEYSTORE_BASE64 != ''
              working-directory: ${{ env.APP_DIR }}/src-tauri/gen/android
              env:
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
                  cat > key.properties <<PROPS
                  keyAlias=$ANDROID_KEY_ALIAS
                  password=$ANDROID_KEY_PASSWORD
                  storeFile=$GITHUB_WORKSPACE/$APP_DIR/src-tauri/gen/android/release.keystore
                  PROPS
            - name: Build signed release (APK and AAB)
              if: env.ANDROID_KEYSTORE_BASE64 != ''
              uses: tauri-apps/tauri-action@v1
              with:
                  projectPath: ${{ env.APP_DIR }}
                  tauriScript: pnpm tauri
                  mobile: android
                  args: --apk --aab
                  uploadWorkflowArtifacts: true
                  workflowArtifactNamePattern: scan-app-android-[bundle]
            # An unsigned release APK cannot be installed, so without a
            # keystore secret fall back to an installable debug build.
            - name: Build debug APK (no keystore configured)
              if: env.ANDROID_KEYSTORE_BASE64 == ''
              uses: tauri-apps/tauri-action@v1
              with:
                  projectPath: ${{ env.APP_DIR }}
                  tauriScript: pnpm tauri
                  mobile: android
                  args: --debug --apk
                  uploadWorkflowArtifacts: true
                  workflowArtifactNamePattern: scan-app-android-debug
            - name: Upload build to release
              if: inputs.release_tag != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  shopt -s globstar nullglob
                  files=(apps/scan-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk apps/scan-app/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab)
                  if [ ${#files[@]} -eq 0 ]; then
                      echo "::error::No Android build output found to upload"
                      exit 1
                  fi
                  gh release upload "${{ inputs.release_tag }}" "${files[@]}" --clobber
    build-ios:
        if: inputs.platform == 'all' || inputs.platform == 'ios'
        runs-on: macos-latest
        permissions:
            contents: write
        env:
            APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
            APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            # Tauri needs the team id even to generate the Xcode project, and
            # an IPA needs the certificate.
            - name: Require Apple credentials
              run: |
                  missing=0
                  for name in APPLE_DEVELOPMENT_TEAM APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE; do
                      if [ -z "${!name}" ]; then
                          echo "::error::Secret $name is not set"
                          missing=1
                      fi
                  done
                  exit $missing
              env:
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Setup pnpm store path
              id: pnpm-store
              run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
            - name: Cache Rust build
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: ${{ env.APP_DIR }}/src-tauri
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter scan-app...
            # The Xcode project is not committed (only gen/android is), so
            # generate it here.
            - name: Initialize iOS project
              working-directory: ${{ env.APP_DIR }}
              run: pnpm tauri ios init
            - name: Import signing certificate and provisioning profile
              env:
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
                  KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
              run: |
                  KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
                  echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
                  security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  security list-keychain -d user -s "$KEYCHAIN"
                  mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
                  echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"
            - name: Build signed IPA
              uses: tauri-apps/tauri-action@v1
              with:
                  projectPath: ${{ env.APP_DIR }}
                  tauriScript: pnpm tauri
                  mobile: ios
                  args: --export-method ${{ vars.APPLE_EXPORT_METHOD || 'release-testing' }}
                  uploadWorkflowArtifacts: true
                  workflowArtifactNamePattern: scan-app-ios-[bundle]
            - name: Upload build to release
              if: inputs.release_tag != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  shopt -s globstar nullglob
                  files=(apps/scan-app/src-tauri/gen/apple/build/**/*.ipa)
                  if [ ${#files[@]} -eq 0 ]; then
                      echo "::error::No iOS build output found to upload"
                      exit 1
                  fi
                  gh release upload "${{ inputs.release_tag }}" "${files[@]}" --clobber
