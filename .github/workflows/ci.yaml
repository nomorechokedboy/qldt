name: Continuous Integration
on:
    # Pre-merge gate: every job below that runs on a PR only tests — it
    # never builds/pushes an image, so a PR (including from a fork) never
    # touches the registry or needs its secrets.
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            component:
                description: What to test and build
                type: choice
                options:
                    - all
                    - api
                    - web
                    - e2e
                    - cron
                default: all
            version:
                description: 'Version to tag the built image with (set by the release workflow; leave blank for a manual run)'
                type: string
                default: ''
env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ${{ github.repository_owner }}
jobs:
    test-api:
        if: github.event_name == 'pull_request' || (inputs.component == 'all' || inputs.component == 'api')
        runs-on: ubuntu-latest
        env:
            CI: 'true'
            # Keep in step with the encore.dev version in pnpm-lock.yaml. A
            # newer CLI tries to re-run `pnpm install` to sync it and fails.
            ENCORE_VERSION: 1.58.4
            # The API refuses to start without these; the tests only need
            # some value, they never reach a real service.
            HASH_SECRET: ci-hash-secret
            JWT_PRIVATE_KEY: ci-jwt-secret
            S3_ACCESS_KEY: ci-access-key
            S3_SECRET_KEY: ci-secret-key
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Install Encore
              run: |
                  curl -L https://encore.dev/install.sh | bash -s -- "$ENCORE_VERSION"
                  echo "$HOME/.encore/bin" >> $GITHUB_PATH
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Setup pnpm store path
              id: pnpm-store
              run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            - name: Install API Dependencies
              working-directory: apps/api
              run: pnpm install --frozen-lockfile
            - name: Run API tests
              working-directory: apps/api
              run: encore test --run
    test-web:
        if: github.event_name == 'pull_request' || (inputs.component == 'all' || inputs.component == 'web')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Setup pnpm store path
              id: pnpm-store
              run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            - name: Install Web Dependencies
              run: pnpm install --frozen-lockfile --filter web...
            - name: Run Web tests
              working-directory: apps/web
              run: pnpm test
    test-e2e:
        if: github.event_name == 'pull_request' || (inputs.component == 'all' || inputs.component == 'e2e')
        runs-on: ubuntu-latest
        env:
            CI: 'true'
            # Keep in step with the encore.dev version in pnpm-lock.yaml. A
            # newer CLI tries to re-run `pnpm install` to sync it and fails.
            ENCORE_VERSION: 1.58.4
            # The API refuses to start without these; the suite only needs
            # some value, it never reaches a real service.
            HASH_SECRET: ci-hash-secret
            JWT_PRIVATE_KEY: ci-jwt-secret
            S3_ACCESS_KEY: ci-access-key
            S3_SECRET_KEY: ci-secret-key
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Install Encore
              run: |
                  curl -L https://encore.dev/install.sh | bash -s -- "$ENCORE_VERSION"
                  echo "$HOME/.encore/bin" >> $GITHUB_PATH
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Setup pnpm store path
              id: pnpm-store
              run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            # Root-level install: the suite drives both the built web app and
            # a live API, so both workspaces (plus qldt-e2e itself) need to
            # be present, not just one filtered package.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Install Playwright browser
              working-directory: apps/qldt-e2e
              run: pnpm exec playwright install --with-deps chromium
            - name: Run e2e suite
              run: pnpm e2e
            - name: Upload e2e artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: qldt-e2e-results
                  path: |
                      apps/qldt-e2e/test-results
                      apps/qldt-e2e/playwright-report
                  retention-days: 7
    build-api:
        needs: test-api
        if: github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'api')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        env:
            # Keep in step with the encore.dev version in pnpm-lock.yaml. A
            # newer CLI tries to re-run `pnpm install` to sync it and fails.
            ENCORE_VERSION: 1.58.4
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Install Encore
              run: |
                  curl -L https://encore.dev/install.sh | bash -s -- "$ENCORE_VERSION"
                  echo "$HOME/.encore/bin" >> $GITHUB_PATH
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install pnpm
              uses: pnpm/action-setup@v4
            - name: Setup pnpm store path
              id: pnpm-store
              run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/qldt-api
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix={{branch}}-
                      type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            - name: Install API Dependencies
              working-directory: apps/api
              run: pnpm install --frozen-lockfile
            - name: Build Encore Docker image
              working-directory: apps/api
              run: |
                  encore build docker temp-api:build --base=node:22-slim --config ./infra.config.json
            - name: Build final Docker image
              working-directory: apps/api
              run: |
                  docker build -t temp-final-api:build .
            - name: Tag and push API image
              run: |
                  # Tag with all GHCR tags
                  for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' '); do
                    docker tag temp-final-api:build "$tag"
                    docker push "$tag"
                  done
            - name: Image digest
              run: echo "API image pushed successfully"
    build-web:
        needs: test-web
        if: github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'web')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/qldt-web
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix={{branch}}-
                      type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            - name: Build and push Web image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/web/Dockerfile
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,mode=max,scope=web
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      VITE_API_URL=${{ vars.WEB_VITE_API_URL }}
    build-cron:
        if: github.event_name == 'workflow_dispatch' && (inputs.component == 'all' || inputs.component == 'cron')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/qldt-cron
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix={{branch}}-
            - name: Build and push Cron image
              uses: docker/build-push-action@v6
              with:
                  context: deploy/cron
                  file: deploy/cron/Dockerfile
                  cache-from: type=gha,scope=cron
                  cache-to: type=gha,mode=max,scope=cron
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
